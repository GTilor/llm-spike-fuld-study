[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adafuld"
version = "0.1.0"
description = "Empirical and theoretical study of FULD redescending innovations vs. dormant preconditioner mismatch in single-pass Transformer training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GTilor"}
]
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
analysis = [
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
]
modal = [
  "modal>=0.64.0",
  "tiktoken>=0.6.0",
  "pyarrow>=14.0.0",
  "scipy>=1.10.0",
]
dev = [
  "pytest>=7.4.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["adafuld*"]
